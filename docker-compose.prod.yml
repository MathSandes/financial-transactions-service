version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/financial"
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000"
volumes:
  pgdata:
