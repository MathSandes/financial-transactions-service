name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financial" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run migrations (deploy)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial
        run: npx prisma migrate deploy
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial
        run: npm test
